cst:
  library_path: D:/CST2026/CST Studio Suite 2026/AMD64/python_cst_libraries
  connect_mode: any_or_new

solver:
  stagnation_timeout_s: 300.0
  settle_s: 2.0
  evaluation_timeout_s: 600.0

logging:
  enabled: true
  output_dir: D:/Results/workflow3
  auto_flush_interval: 1

project:
  cst_path: D:/ModelData/XBandGun_Workflow3.cst

evaluation:
  two_pass: true
  calibration_guess_ghz: 11.424
  post_eval_recovery: tier3
  inter_pass_recovery: true
  s11_depth_threshold_db: -1.0
  mode_spacing_ghz: 0.04
  frequency_gate:
    enabled: true
    target_ghz: 11.424
    max_abs_offset_mhz: 20.0

# Resume / continue from a previous run (also usable via CLI --resume-from)
resume:
  enabled: false
  jsonl_path: "workflow3/stage_2/evaluation_records.jsonl"
  n_initial_extra: 4
  tighten_bounds: false

optimization:
  algorithm: sao
  n_initial: 12
  n_iterations: 40
  seed: 42
  acquisition_function: ei
  acquisition_xi: 0.01
  acquisition_kappa: 2.0
  objective_weights:
    resonant_freq: 5.0
    coupling_beta: 3.0
    field_flatness: 5.0
    s21_at_f0_db: 4.0
    p_input: 2.0
    max_modified_poynting: 1.0
    pulsed_heating: 1.0
  staged_search:
    enabled: true
    stage_2:
      n_initial: 8
      n_iterations: 24
      shrink_factor: 0.35
      recenter_on_best: true
  adaptive_bounds:
    enabled: true
    rejection_threshold: 0.4
    shrink_factor: 0.7
    max_shrink_rounds: 3
    min_span_ratio: 0.1
    boundary_proximity: 0.1
    expand_factor: 1.5
    max_span_ratio: 2.0
  retry:
    enabled: true
    max_tier1: 0
    max_tier2: 2
    max_tier3: 2
    cooldown_s: 5.0

parameters:
  # Best point from run 2026-05-26 (iter 4, field_flatness=0.019).
  # Adaptive bounds enabled -- will expand if optimum hits boundary.
  - name: R_cell_3
    display_name: Cell 3 Equator Radius
    unit: mm
    nominal: 10.780
    delta_minus: 0.03
    delta_plus: 0.03
    min_step: 0.0015
  - name: R_between_cell_3_cutoff
    display_name: Iris Radius Cell 3 to Cutoff
    unit: mm
    nominal: 4.015
    delta_minus: 0.03
    delta_plus: 0.03
    min_step: 0.0015
  - name: R_between_cell_2_3
    display_name: Iris Radius Between Cell 2 and 3
    unit: mm
    nominal: 3.291
    delta_minus: 0.015
    delta_plus: 0.015
    min_step: 0.0008
  - name: R_bend_cell3_left
    display_name: Bend Radius Cell 3 Left
    unit: mm
    nominal: 2.460
    delta_minus: 0.015
    delta_plus: 0.015
    min_step: 0.0008
  - name: PickUpDeep
    display_name: Pick Up Depth
    unit: mm
    nominal: 0.247
    delta_minus: 0.03
    delta_plus: 0.03
    min_step: 0.0015
  - name: length1
    display_name: Coupler Length
    unit: mm
    nominal: 1.045
    delta_minus: 0.03
    delta_plus: 0.03
    min_step: 0.0015
  - name: e_x
    display_name: Ellipse X
    unit: mm
    nominal: 1.796
    delta_minus: 0.02
    delta_plus: 0.02
    min_step: 0.001
  - name: e
    display_name: Ellipse E
    unit: mm
    nominal: 1.565
    delta_minus: 0.015
    delta_plus: 0.015
    min_step: 0.0008
  - name: esp_e_cell3_left
    display_name: Ellipse E Cell 3 Left
    unit: mm
    nominal: 2.652
    delta_minus: 0.03
    delta_plus: 0.03
    min_step: 0.0015
  - name: esp_e_cell3_right
    display_name: Ellipse E Cell 3 Right
    unit: mm
    nominal: 2.816
    delta_minus: 0.03
    delta_plus: 0.03
    min_step: 0.0015
  - name: cell_3_vertical_left
    display_name: Cell 3 Vertical Left
    unit: mm
    nominal: 0.929
    delta_minus: 0.005
    delta_plus: 0.005
    min_step: 0.0003
  - name: cell_3_vertical_right
    display_name: Cell 3 Vertical Right
    unit: mm
    nominal: 0.930
    delta_minus: 0.01
    delta_plus: 0.01
    min_step: 0.0005
  - name: bend1
    display_name: Coupler Bend Parameter 1
    unit: mm
    nominal: 1.568
    delta_minus: 0.02
    delta_plus: 0.02
    min_step: 0.001

objectives:
  - name: resonant_freq
    enabled: true
    role: optimize
    priority: 1
    mode: tolerance_soft
    mode_params:
      target: 11.424
      tolerance: 0.0005
      scale: 0.006
  - name: coupling_beta
    enabled: true
    role: optimize
    priority: 1
    mode: tolerance_soft
    mode_params:
      target: 2.0
      tolerance: 0.2
      scale: 5.0
  - name: field_flatness
    enabled: true
    role: optimize
    priority: 1
    mode: less_than_soft
    mode_params:
      threshold: 0.0
      tolerance: 0.025
      scale: 0.10
  - name: s21_at_f0_db
    enabled: true
    role: optimize
    priority: 1
    mode: tolerance_soft
    mode_params:
      target: -59.0
      tolerance: 3.0
      scale: 4.0
    obj_params:
      transmission_port: 2
      search_width_ghz: 0.01
  - name: p_input
    enabled: true
    role: optimize
    priority: 1
    mode: less_than_soft
    mode_params:
      threshold: 8000000.0
      scale: 8000000.0
    obj_params:
      target_e_acc_vm: 200000000.0
  - name: max_modified_poynting
    enabled: true
    role: threshold
    priority: 2
    threshold: 5000000000000.0
    sigma: 1000000000000.0
    direction: less_than
    obj_params:
      gc: 0.125
      e_target: 200000000.0
  - name: pulsed_heating
    enabled: true
    role: threshold
    priority: 2
    threshold: 50.0
    sigma: 10.0
    direction: less_than
    obj_params:
      e_target: 200000000.0
      pulse_width_ns: 300.0
      frequency_hz: 11424000000.0
      rrr: 5.5
  - name: e_peak
    enabled: true
    role: report_only
    priority: 3
    report_as: e_peak
  - name: s11_db
    enabled: true
    role: report_only
    priority: 3
    report_as: s11_db
  - name: q0
    enabled: true
    role: report_only
    priority: 3
  - name: q_loaded
    enabled: true
    role: report_only
    priority: 3
