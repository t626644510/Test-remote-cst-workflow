[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cst-optimization"
version = "0.2.0"
description = "Microwave accelerator cavity automated EM simulation and surrogate-model optimization framework"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "scikit-learn>=1.0",
    "pymoo>=0.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "no_cst: tests that do NOT require a CST Studio Suite licence or DesignEnvironment connection (safe for CI / offline dev)",
    "cst_required: tests that need a live CST DesignEnvironment — skip by default; run with -m cst_required when CST is available",
    "slow: tests that take more than a few seconds even without CST (intensive parameter sweeps, large synthesis checks)",
]
