name: no-CST validation

on:
  pull_request:
    branches:
      - main
      - "workflow/**"
  push:
    branches:
      - main
      - "workflow/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: no-cst-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-cst:
    name: no-cst
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install no-CST test dependencies
        run: python -m pip install -e ".[dev,cad,review]"

      - name: Compile Python sources
        run: python -m compileall -q src workflows

      - name: Run complete no-CST suite
        run: python -m pytest -q -m "not cst_required"
