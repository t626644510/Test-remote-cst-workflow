# Copy to config.local.yaml (ignored by git). Paths relative to this file are supported.
workflow_6:
  paths:
    templates:
      axis: INPUTS/Overhaul_Wake.cst
      x: INPUTS/Overhaul_WakeOffsetX2.cst
      y: INPUTS/Overhaul_WakeOffsetY2.cst
      thermal: INPUTS/Overhaul_ThermalCal.cst
    output_dir: OUTPUT/metadata
    artifact_dir: ARTIFACTS/wf6
    # Empty uses CST_PYTHON_LIB; do not commit station installation paths.
    cst_library_path: ''
  physics:
    band_hz: [550000000, 2047828853.9789505]
    longitudinal_limit: 2000
    transverse_limit: 150000
    power_reference_w: 150
    voltage_peak_v: 500000
    thermal_band_hz: [498000000, 502000000]
    components: [component5, component6]
    sigma_m: 0.05
    wake_length_m: 35
    offset_m: 0.002
  search:
    hours: 96
    exploration_fraction: 0.20
    initial_points: 12
    pool: 2048
    gp_min_samples: 6
    fixed_radius_mm: 25
  reconstruction:
    seeds: [17, 43, 109]
    starts_m: [1, 3]
    max_error: 0.10
    min_correlation: 0.95
    peak_spread: 0.20
    q_bounds: [1, 1000000]
  runtime:
    stage_timeout_s: 14400
    postprocess_timeout_s: 1800
    repair_timeout_s: 7200
    repair_retries: 10
    port_parameters: [Port2Length, port3Length]
    port_values_mm: [20, 22, 18, 24, 16, 26, 14, 28, 12, 30, 10]
    retain_pareto: 5
    retain_recent: 2
    minimum_free_gib: 15
  parameter_mapping:
    Lin1: Lin
