    nose_left_inner_delta_z_mm: 6.0
    nose_right_inner_delta_r_mm: 5.0
    blend_left_radius_delta_mm: 9.0

objectives:
  frequency_mhz:
    target: 500.0
    window: [490.0, 510.0]
    mode: target
    unit: MHz
  r_over_q_ohm:
    mode: maximize
    unit: Ohm
  q_factor:
    mode: soft_constraint
    floor: 30000.0
    unit: dimensionless
  shunt_impedance_ohm:
    expression: r_over_q_ohm * q_factor
    mode: maximize
    unit: Ohm
  novelty:
    mode: reward
    weight: 0.1
    unit: normalized

sao_exploratory:
  n_initial_min: 36
  n_initial_per_dimension: 3
  n_iterations: 120
  acquisition: expected_improvement
  xi: 0.01
  seed: 42
