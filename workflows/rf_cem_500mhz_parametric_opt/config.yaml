  equator_crown_z_mid_mm: [-15.0, 15.0]
  equator_left_shoulder_z_abs_mm: [15.0, 55.0]
  equator_right_shoulder_z_abs_mm: [15.0, 55.0]
  equator_left_shoulder_delta_r_mm: [-6.0, 8.0]
  equator_right_shoulder_delta_r_mm: [-6.0, 8.0]
  nose_left_inner_delta_r_mm: [-5.0, 8.0]
  nose_right_inner_delta_r_mm: [-5.0, 8.0]
  nose_left_inner_delta_z_mm: [-8.0, 8.0]
  nose_right_inner_delta_z_mm: [-8.0, 8.0]
  blend_left_radius_delta_mm: [-8.0, 12.0]
  blend_right_radius_delta_mm: [-8.0, 12.0]

scan_points:
  - equator_crown_delta_r_mm: -5.0
    equator_left_shoulder_z_abs_mm: 22.0
    equator_right_shoulder_z_abs_mm: 38.0
    nose_left_inner_delta_r_mm: 3.0
    blend_right_radius_delta_mm: 6.0
  - equator_crown_delta_r_mm: 6.0
    equator_crown_z_mid_mm: 8.0
    equator_left_shoulder_delta_r_mm: 5.0
    equator_right_shoulder_delta_r_mm: -3.0
    nose_right_inner_delta_z_mm: -5.0
